context: |
  Rust project (Cargo workspace): `crates/lulu-prep` library + `crates/lulu-prep-cli` binary (`lulu-prep`).
  Purpose: turn an arbitrary PDF into print-ready interior + cover files for Lulu's print-on-demand service.
  Domain: Lulu Print API product SKUs (`pod_package_id`), trim/bleed geometry, spine width, page-count rules.
  All geometric facts must trace to Lulu's published documentation and live in one module; tests assert
  Lulu's own worked examples (e.g. 6x9in perfect-bound, 210 pages -> 920x666 pt cover).
  Constraints: works fully offline with no external binaries; Ghostscript and qpdf are optional subprocesses
  (Ghostscript is AGPL and must never be linked); the Lulu Print API sits behind an off-by-default feature.
  Style: units are a newtype stored in points, never bare f64 in public signatures.
